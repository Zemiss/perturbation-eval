[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbation-eval"
version = "0.5.0"
description = "Six VCC2026 raw metrics for H5AD counts and GEARS test predictions"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
perturbation-eval = "evaluate.run:main"
gears-eval = "evaluate.run:main"

[tool.setuptools]
packages = ["evaluate"]
package-dir = {evaluate = "."}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
