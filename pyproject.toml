[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbation-eval"
version = "0.3.0"
description = "Strict VCC2026 counts evaluation using the six cell-eval2 metrics"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
perturbation-eval = "evaluate.run:main"
gears-eval = "evaluate.evaluate_gears:main"
perturbation-eval-legacy = "evaluate.run:legacy_main"
gears-chreode-eval = "evaluate.evaluate_gears:legacy_main"

[tool.setuptools]
packages = ["evaluate"]
package-dir = {evaluate = "."}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
