[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbation-eval"
version = "0.5.0"
description = "Four-path H5AD evaluation with six VCC2026 raw metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.0,<3",
    "anndata>=0.10,<0.13",
    "polars>=1,<3",
    "cell-eval2==0.18.0",
    "pdex==0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
perturbation-eval = "evaluate.run:main"
gears-eval = "evaluate.run:main"

[tool.setuptools.packages.find]
include = ["evaluate*", "baseline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
